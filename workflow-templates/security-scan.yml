name: Security Scan
on:
  push:
    branches: [$default-branch]
  pull_request:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    name: Sensitive data detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks git --redact --verbose .
